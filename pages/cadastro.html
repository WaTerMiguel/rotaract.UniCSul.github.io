<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro | Rotaract Diadema Floreat</title>
  <link rel="stylesheet" href="../css/style_cadastro.css">
</head>

<body>
  <header class="cabecalho-formulario">
    <a class="logo-formulario" href="index.html">
      <span class="marca-logo" aria-hidden="true">✦</span>
      Rotaract Diadema Floreat
    </a>

    <a class="botao-home" href="../index.html">Início</a>
  </header>

  <main>
    <form class="formulario-cadastro" action="#" method="post">
      <fieldset>
        <legend>Cadastre-se para participar do Rotaract Diadema Floreat</legend>

        <p>
          <label for="nome">Nome completo:</label><br>
          <input type="text" id="nome" name="nome" required>
        </p>

        <p>
          <label for="email">E-mail:</label><br>
          <input type="email" id="email" name="email" required>
        </p>

        <p>
          <label for="telefone">Telefone/ WhatsApp:</label><br>
          <input
            type="tel"
            id="telefone"
            name="telefone"
            placeholder="(00) 00000-0000"
            pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}"
            required
          >
        </p>

        <p>
          <label for="cpf">CPF:</label><br>
          <input
            type="text"
            id="cpf"
            name="cpf"
            placeholder="000.000.000-00"
            pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
            required
          >
        </p>

        <p>
          <label for="nascimento">Data de nascimento:</label><br>
          <input type="date" id="nascimento" name="nascimento" required>
        </p>
      </fieldset>

      <fieldset>
        <legend>Endereço</legend>

        <p>
          <label for="cep">CEP:</label><br>
          <input
            type="text"
            id="cep"
            name="cep"
            placeholder="00000-000"
            pattern="[0-9]{5}-[0-9]{3}"
            required
          >
        </p>

        <p>
          <label for="endereco">Endereço:</label><br>
          <input type="text" id="endereco" name="endereco" required>
        </p>

        <p>
          <label for="cidade">Cidade:</label><br>
          <input type="text" id="cidade" name="cidade" value="Diadema" required>
        </p>

        <p>
          <label for="estado">Estado:</label><br>
          <select id="estado" name="estado" required>
            <option value="">Selecione</option>
            <option value="SP">São Paulo</option>
            <option value="MG">Minas Gerais</option>
            <option value="RJ">Rio de Janeiro</option>
            <option value="PR">Paraná</option>
          </select>
        </p>
      </fieldset>

      <fieldset>
        <legend>Como deseja participar?</legend>

        <p>
          <input type="checkbox" id="voluntariado" name="interesse" value="voluntariado">
          <label for="voluntariado">Quero participar de ações voluntárias.</label>
        </p>

        <p>
          <input type="checkbox" id="sustentabilidade" name="interesse" value="sustentabilidade">
          <label for="sustentabilidade">Tenho interesse em ações de sustentabilidade.</label>
        </p>

        <p>
          <input type="checkbox" id="protecao-animal" name="interesse" value="protecao-animal">
          <label for="protecao-animal">Tenho interesse em ações de proteção animal.</label>
        </p>

        <p>
          <input type="checkbox" id="cidadania" name="interesse" value="cidadania">
          <label for="cidadania">Tenho interesse em ações de cidadania.</label>
        </p>
      </fieldset>

      <p>
        <input type="checkbox" id="termos" name="termos" required>
        <label for="termos">Autorizo o contato do Rotaract Diadema Floreat.</label>
      </p>

      <p>
        <button type="submit">Enviar cadastro</button>
        <button type="reset">Limpar formulário</button>
      </p>
    </form>
  </main>
</body>
</html>
